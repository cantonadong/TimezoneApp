<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Clock · UI Preview</title>
<style>
:root{--blue:#086bff;--ink:#111318;--muted:#787d87;--paper:#fafbfe}*{box-sizing:border-box}body{margin:0;background:#e9edf5;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}#app{max-width:480px;margin:auto;height:100dvh;height:100vh;background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 12px;gap:12px}h1{font-size:25px;letter-spacing:-.5px;margin:0;font-weight:700}.icon{font-size:26px;min-width:40px;min-height:40px}.icon img{display:block;width:24px;height:24px;object-fit:contain;margin:auto}.subhead{font-size:18px;text-align:center;flex:1}.preview-label{font-size:10px;letter-spacing:1px;color:#7f8795;margin:0 24px 12px}main{overflow:auto;flex:1;min-height:0;padding:0 16px;overscroll-behavior:contain}.list{border-radius:20px;overflow:hidden;background:white}.swipe{position:relative;overflow:hidden;border-bottom:1px solid #f0f1f4}.swipe:last-child{border-bottom:0}.actions{position:absolute;inset:0;display:flex;justify-content:space-between}.actions button{width:84px;color:#fff;font-size:13px;line-height:1.5}.pin{background:var(--blue)}.delete{background:#ff393f}.city{position:relative;display:flex;align-items:center;gap:12px;padding:18px 8px;background:#fff;min-height:100px;transition:transform .18s ease;touch-action:pan-y;user-select:none}.portrait{width:56px;height:56px;flex:0 0 56px;border-radius:50%;background-size:cover;background-position:center;background-color:#cfe4fc}.info{flex:1;min-width:0}.name{font-size:17px;font-weight:600}.zone{font-size:12px;line-height:1.65;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.timebox{text-align:right;flex:0 0 auto}.list-time{text-align:center}.time{font-size:29px;letter-spacing:-.8px;font-weight:600;font-variant-numeric:tabular-nums}.date{font-size:12px;color:var(--muted);margin-top:4px}.foot{padding:16px 22px 18px;background:var(--paper)}.primary{background:var(--blue);color:white;border-radius:32px;min-height:52px;padding:12px 20px;width:100%;font-size:16px}.plus{font-size:30px;vertical-align:-2px;margin-right:12px;font-weight:300}.hint{font-size:11px;color:var(--muted);text-align:center;margin:12px 0 0}.search{display:flex;margin:0 6px 12px;border-radius:30px;background:#eff1f5;padding:10px 15px;gap:10px;color:var(--muted)}.search input{border:0;outline:0;background:none;width:100%;min-width:0;font-size:14px}.pick{width:100%;display:flex;align-items:center;text-align:left;gap:12px;padding:10px;border-bottom:1px solid #f0f1f4;background:white;border-radius:4px}.globe{display:block;width:56px;height:56px;flex:0 0 56px;object-fit:contain}.pick .globe{width:44px;height:44px;flex-basis:44px}.widget-choice-time{margin-left:auto;font-size:20px;font-variant-numeric:tabular-nums}.pick .portrait{width:44px;height:44px;flex-basis:44px;background-size:cover;background-position:center}.pick .name{font-size:15px}.pick .zone{margin:0}.pick.selected{background:#e6f1ff;border-radius:12px}.offset{font-size:12px;color:var(--muted);margin-left:auto}.selection{padding:0 8px 12px}.selection .city{background:transparent;padding:6px 0 12px;min-height:76px}.buttons{display:flex;gap:12px}.buttons button{flex:1;border-radius:28px;padding:13px}.secondary{background:#eceef3}.toast{position:absolute;bottom:98px;left:20px;right:20px;background:#242832;color:white;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;z-index:8;box-shadow:0 8px 24px #151a3222;font-size:14px}.toast button{color:#8fbeff;font-weight:600;min-height:32px}.backdrop{position:absolute;inset:0;background:#15223866;z-index:10;display:flex;align-items:flex-end}.sheet{background:white;width:100%;border-radius:26px 26px 0 0;padding:24px;max-height:92%;overflow:auto}.sheet h2{margin:0 0 18px;font-size:21px}.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;font-size:14px}.field select{max-width:60%;padding:8px;border:1px solid #dde1e8;border-radius:10px;background:#f7f8fb}.sheet .secondary{border-radius:14px;padding:12px;margin-top:10px;width:100%}.empty{text-align:center;padding:72px 18px;color:var(--muted)}.empty .symbol{font-size:46px;margin-bottom:18px;color:#a8bad5}.empty h2{font-size:20px;color:var(--ink);font-weight:600}.empty p{font-size:14px;line-height:1.7}.skeleton{margin:10px 0;height:96px;border-radius:18px;background:linear-gradient(100deg,#eef0f5 20%,#fafbfe 45%,#eef0f5 70%);background-size:200%;animation:shimmer 1.5s infinite}@keyframes shimmer{to{background-position:-200% 0}}.paused *{animation-play-state:paused!important;transition:none!important}.wallpaper{border-radius:24px;padding:40px 22px;background:linear-gradient(155deg,#89b2dc,#c8b3c4 35%,#ecc0a6 50%,#3b6388 74%,#183457);margin:8px 0 24px;min-height:235px;display:flex;align-items:center;justify-content:center}.widget{width:210px;aspect-ratio:1.5/1;border-radius:18px;background:#ffffff99;border:0;text-align:center;padding:8px;display:flex;flex-direction:column;justify-content:center;color:#111318;box-shadow:0 8px 24px #1521320c}.widget.dark{background:#12172199;color:white}.widget-time{font-size:52px;line-height:1.1;font-weight:600;letter-spacing:0;font-stretch:normal;transform:none;white-space:nowrap}.widget-city{font-size:15px;line-height:1.2;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.choice{display:flex;gap:12px;margin-bottom:22px}.choice button{border:2px solid transparent;background:#eceef3;border-radius:14px;padding:14px;flex:1}.choice .chosen{border-color:var(--blue);color:var(--blue);background:#edf5ff}.description{font-size:13px;color:var(--muted);line-height:1.7}.edge .name{overflow-wrap:anywhere}.edge .city{gap:8px}.edge .time{font-size:24px}@media(max-width:350px){header{padding:14px 16px 8px}main{padding:0 10px}.city{gap:8px}.portrait{width:44px;height:44px;flex-basis:44px;background-size:cover;background-position:center}.name{font-size:15px}.time{font-size:24px}.zone,.date{font-size:11px}.foot{padding:12px 16px}.widget-time{font-size:48px}}@supports(height:100dvh){#app{height:100dvh}}
@media(max-width:350px){.globe{width:44px;height:44px;flex-basis:44px}}
#choose-widget-city{display:flex;align-items:center;gap:8px}.selected-meta{display:flex;flex:1;min-width:0;flex-direction:column}.selected-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selected-utc{font-size:12px;color:var(--muted);text-align:left}.selected-time{font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
</style>
</head>
<body><div id="app"></div>
<script>
const cities=[
{id:'beijing',zh:'北京',en:'Beijing',country:['中国','China'],zone:['中国标准时间','China Standard Time'],abbr:'CST',utc:'+8',time:'17:24',y:-133},
{id:'newyork',zh:'纽约',en:'New York',country:['美国','United States'],zone:['美国东部时间','Eastern Daylight Time'],abbr:'EDT',utc:'−4',time:'05:24',y:-213},
{id:'london',zh:'伦敦',en:'London',country:['英国','United Kingdom'],zone:['英国夏令时','British Summer Time'],abbr:'BST',utc:'+1',time:'10:24',y:-293},
{id:'tokyo',zh:'东京',en:'Tokyo',country:['日本','Japan'],zone:['日本标准时间','Japan Standard Time'],abbr:'JST',utc:'+9',time:'18:24',y:-375},
{id:'sydney',zh:'悉尼',en:'Sydney',country:['澳大利亚','Australia'],zone:['澳大利亚东部时间','Australian Eastern Time'],abbr:'AEST',utc:'+10',time:'19:24',y:-455},
{id:'singapore',zh:'新加坡',en:'Singapore',country:['新加坡','Singapore'],zone:['新加坡时间','Singapore Time'],abbr:'SGT',utc:'+8',time:'17:24',y:-534},
{id:'hongkong',zh:'香港',en:'Hong Kong',country:['中国','China'],zone:['香港时间','Hong Kong Time'],abbr:'HKT',utc:'+8',time:'17:24',y:-133},
{id:'brisbane',zh:'布里斯班',en:'Brisbane',country:['澳大利亚','Australia'],zone:['澳大利亚东部标准时间','Australian Eastern Standard Time'],abbr:'AEST',utc:'+10',time:'19:24',y:-455},
{id:'auckland',zh:'奥克兰',en:'Auckland',country:['新西兰','New Zealand'],zone:['新西兰标准时间','New Zealand Standard Time'],abbr:'NZST',utc:'+12',time:'21:24',y:-455},
{id:'losangeles',zh:'洛杉矶',en:'Los Angeles',country:['美国','United States'],zone:['太平洋夏令时','Pacific Daylight Time'],abbr:'PDT',utc:'−7',time:'02:24',y:-213},
{id:'paris',zh:'巴黎',en:'Paris',country:['法国','France'],zone:['中欧夏令时','Central European Summer Time'],abbr:'CEST',utc:'+2',time:'11:24'},
{id:'berlin',zh:'柏林',en:'Berlin',country:['德国','Germany'],zone:['中欧夏令时','Central European Summer Time'],abbr:'CEST',utc:'+2',time:'11:24'},
{id:'rome',zh:'罗马',en:'Rome',country:['意大利','Italy'],zone:['中欧夏令时','Central European Summer Time'],abbr:'CEST',utc:'+2',time:'11:24'},
{id:'dubai',zh:'迪拜',en:'Dubai',country:['阿联酋','United Arab Emirates'],zone:['海湾标准时间','Gulf Standard Time'],abbr:'GST',utc:'+4',time:'13:24'},
{id:'mumbai',zh:'孟买',en:'Mumbai',country:['印度','India'],zone:['印度标准时间','India Standard Time'],abbr:'IST',utc:'+5:30',time:'14:54'},
{id:'cairo',zh:'开罗',en:'Cairo',country:['埃及','Egypt'],zone:['东欧时间','Eastern European Time'],abbr:'EET',utc:'+2',time:'11:24'},
{id:'honolulu',zh:'檀香山',en:'Honolulu',country:['美国','United States'],zone:['夏威夷时间','Hawaii Standard Time'],abbr:'HST',utc:'−10',time:'23:24'}
];
let lang=navigator.language.startsWith('zh')?'zh':'en',page='list',state='normal',saved=cities.slice(0,5).map(c=>c.id),selected='beijing',widgetCity='beijing',dark=false,paused=false,query='',undo=null,toastTimer;
const app=document.getElementById('app'),t=(zh,en)=>lang==='zh'?zh:en,get=id=>cities.find(c=>c.id===id),name=c=>c[lang],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function globe(){return `<img class="globe" src="globe.png" alt="">`}
function content(c,listStyle=false){if(listStyle)return `${globe()}<div class="info"><div class="name">${name(c)}</div><div class="zone">${c.country[lang==='zh'?0:1]}<br>UTC ${c.utc}</div></div><div class="timebox list-time"><div class="time">${c.time}</div></div>`;return `${globe()}<div class="info"><div class="name">${name(c)}</div><div class="zone">${c.zone[lang==='zh'?0:1]} (${c.abbr})<br>UTC ${c.utc}</div></div><div class="timebox"><div class="time">${c.time}</div></div>`}
function render(){app.className=(paused?'paused ':'')+(state==='edge'?'edge':'');app.innerHTML=`<header>${page==='list'?`<h1>${t('世界时钟','Timezone')}</h1><button class="icon" id="settings" aria-label="${t('预览设置','Preview settings')}"><img src="setting.png" alt="" width="24" height="24"></button>`:`<button class="icon" id="back" aria-label="${t('返回','Back')}">‹</button><h1 class="subhead">${page==='add'?t('添加城市','Add City'):t('桌面卡片','Home Widget')}</h1><span style="width:40px"></span>`}</header><div class="preview-label">${t('UI 预览 · 模拟数据','UI PREVIEW · MOCK DATA')}</div><main id="main"></main><div class="foot" id="foot"></div>`;document.getElementById('settings')?.addEventListener('click',settings);document.getElementById('back')?.addEventListener('click',()=>{page='list';render()});if(page==='list')renderList();if(page==='add')renderAdd();if(page==='widget')renderWidget()}
function renderList(){const main=document.getElementById('main'),foot=document.getElementById('foot');foot.innerHTML=`<button class="primary" id="add">${t('添加城市','Add City')}</button><p class="hint">${t('左滑删除 · 右滑添加桌面卡片','Swipe left to delete · right for a widget')}</p>`;document.getElementById('add').onclick=()=>{page='add';query='';selected=cities.find(c=>!saved.includes(c.id))?.id||cities[0].id;render()};if(state==='loading'){main.innerHTML=Array(5).fill('<div class="skeleton"></div>').join('');return}if(state==='error'){main.innerHTML=`<div class="empty"><div class="symbol">↻</div><h2>${t('暂时无法显示城市','Unable to show cities')}</h2><p>${t('这是错误状态预览，可点击重试恢复。','This is a simulated error. Retry to restore the list.')}</p><button class="primary" id="retry">${t('重试','Retry')}</button></div>`;document.getElementById('retry').onclick=()=>{state='normal';render()};return}const ids=state==='empty'?[]:state==='edge'?cities.map(c=>c.id):saved;if(!ids.length){main.innerHTML=`<div class="empty"><div class="symbol">◷</div><h2>${t('世界时间，从一座城市开始','Your world starts with a city')}</h2><p>${t('添加你关心的城市，轻松查看当地时间。','Add a city to keep its local time close.')}</p></div>`;return}main.innerHTML=`<div class="list">${ids.map((id,index)=>`<div class="swipe" data-id="${id}"><div class="actions"><button class="pin" aria-label="${t('添加桌面卡片','Add widget')}">▦<br>${t('添加到<br>桌面卡片','Add<br>widget')}</button><button class="delete" aria-label="${t('删除','Delete')}">⌫<br>${t('删除','Delete')}</button></div><div class="city" tabindex="0" role="group" aria-label="${name(get(id))}">${content(get(id),true,index)}</div></div>`).join('')}</div>`;main.querySelectorAll('.swipe').forEach(row=>{const city=row.querySelector('.city');let startX,startY,dx=0,drag=false;row.querySelector('.pin').onclick=()=>openWidget(row.dataset.id);row.querySelector('.delete').onclick=()=>removeCity(row.dataset.id);city.onpointerdown=e=>{startX=e.clientX;startY=e.clientY;dx=0;drag=false};city.onpointermove=e=>{if(startX===undefined)return;dx=e.clientX-startX;if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(e.clientY-startY)){drag=true;city.style.transform=`translateX(${Math.max(-84,Math.min(84,dx))}px)`}};city.onpointerup=()=>{if(drag)city.style.transform=`translateX(${dx>35?84:dx< -35?-84:0}px)`;startX=undefined};city.onpointercancel=()=>{startX=undefined;city.style.transform=''};city.onkeydown=e=>{if(e.key==='ArrowLeft')city.style.transform='translateX(-84px)';if(e.key==='ArrowRight')city.style.transform='translateX(84px)';if(e.key==='Escape')city.style.transform='';if(e.key==='Enter')openWidget(row.dataset.id)}})}
function removeCity(id){if(state==='edge'){saved=cities.map(c=>c.id);state='normal'}clearTimeout(toastTimer);const index=saved.indexOf(id);if(index<0)return;undo={id,index};saved.splice(index,1);render();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=`<span>${t('已删除','Removed')} ${name(get(id))}</span><button>${t('撤销','Undo')}</button>`;app.append(el);el.querySelector('button').onclick=()=>{clearTimeout(toastTimer);if(undo)saved.splice(undo.index,0,undo.id);undo=null;render()};toastTimer=setTimeout(()=>{el.remove();undo=null},2000)}
function renderAdd(){document.getElementById('main').innerHTML=`<label class="search"><span>⌕</span><input id="query" value="${esc(query)}" placeholder="${t('搜索城市（中文或英文）','Search cities in Chinese or English')}" aria-label="${t('搜索城市','Search cities')}"></label><div id="options"></div>`;document.getElementById('query').oninput=e=>{query=e.target.value;renderOptions()};renderOptions();renderSelection();requestAnimationFrame(()=>{const main=document.getElementById('main'),options=document.getElementById('options'),beijing=options.querySelector('[data-id=beijing]');if(beijing)main.scrollTop+=beijing.getBoundingClientRect().top-options.getBoundingClientRect().top})}
function renderOptions(){const matches=cities.filter(c=>(c.zh+' '+c.en+' '+c.country.join(' ')).toLowerCase().includes(query.toLowerCase().trim())).sort((a,b)=>Number(a.utc.replace('\u2212','-'))-Number(b.utc.replace('\u2212','-'))||a.en.localeCompare(b.en));document.getElementById('options').innerHTML=matches.length?matches.map(c=>`<button class="pick ${c.id===selected?'selected':''}" data-id="${c.id}" aria-pressed="${c.id===selected}">${globe()}<span class="info"><span class="name">${name(c)}</span><span class="zone" style="display:block">${c.country[lang==='zh'?0:1]}${saved.includes(c.id)?t(' · 已添加',' · Added'):''}<br>UTC ${c.utc}</span></span><span class="widget-choice-time">${c.time}</span></button>`).join(''):`<div class="empty"><h2>${t('没有找到城市','No cities found')}</h2><p>${t('试试中文或英文城市名称','Try a Chinese or English city name')}</p></div>`;document.querySelectorAll('.pick').forEach(el=>el.onclick=()=>{selected=el.dataset.id;renderOptions();renderSelection()})}
function renderSelection(){const c=get(selected);document.getElementById('foot').innerHTML=`<div class="selection"><div class="city">${content(c,true)}</div></div><div class="buttons"><button class="secondary" id="cancel">${t('取消','Cancel')}</button><button class="primary" id="save" ${saved.includes(selected)?'disabled':''}>${saved.includes(selected)?t('已添加','Already added'):t('保存','Save')}</button></div>`;document.getElementById('cancel').onclick=()=>{page='list';render()};document.getElementById('save').onclick=()=>{if(!saved.includes(selected))saved.push(selected);state='normal';page='list';render()}}
function openWidget(id){widgetCity=id;page='widget';render()}
function renderWidget(){const c=get(widgetCity);document.getElementById('main').innerHTML=`<p class="description">${t('为城市选择桌面卡片样式','Choose a home screen style for your city')}</p><button class="secondary" id="choose-widget-city" style="width:100%;text-align:left;padding:12px;margin:0 0 12px;border-radius:14px"><span class="selected-meta"><span class="selected-name">${name(c)}</span><span class="selected-utc">UTC ${c.utc}</span></span><span class="selected-time">${c.time}</span><span aria-hidden="true">&#9662;</span></button><div class="wallpaper"><div class="widget ${dark?'dark':''}"><div class="widget-time">${c.time}</div><div class="widget-city">${name(c)}</div></div></div><div class="choice"><button id="light" class="${dark?'':'chosen'}">${t('白色半透明','Light translucent')}</button><button id="dark" class="${dark?'chosen':''}">${t('黑色半透明','Dark translucent')}</button></div><p class="description">${t('尺寸 2 × 1 · 显示 HH:MM 和城市名称。此处为桌面效果预览，背景用于展示透明度。','Size 2 × 1 · HH:MM and city name. The wallpaper demonstrates card transparency.')}</p>`;document.getElementById('choose-widget-city').onclick=()=>{showSheet('<h2>'+t('\u9009\u62e9\u57ce\u5e02','Choose city')+'</h2>'+saved.map(id=>get(id)).filter(Boolean).map(item=>'<button class="pick" data-id="'+item.id+'">'+globe()+'<span class="info"><span class="name">'+name(item)+'</span></span><span class="widget-choice-time">'+item.time+'</span></button>').join(''));document.querySelectorAll('.sheet .pick').forEach(el=>el.onclick=()=>{widgetCity=el.dataset.id;closeSheet();renderWidget()})};document.getElementById('light').onclick=()=>{dark=false;renderWidget()};document.getElementById('dark').onclick=()=>{dark=true;renderWidget()};document.getElementById('foot').innerHTML=`<button class="primary" id="pin-demo">${t('预览添加到桌面','Preview adding widget')}</button>`;document.getElementById('pin-demo').onclick=()=>{showSheet(`<h2>${t('桌面卡片预览','Widget preview')}</h2><p class="description">${t('当前 APK 仅供确认 UI。实际固定到桌面和自动更新时间将在界面确认后实现。','This is a standalone mock preview. The native app provides real home screen widgets and live time updates.')}</p><button class="secondary" id="close">${t('知道了','Got it')}</button>`);document.getElementById('close').onclick=closeSheet}}
function showSheet(html){closeSheet();const layer=document.createElement('div');layer.className='backdrop';layer.innerHTML=`<section class="sheet" role="dialog" aria-modal="true">${html}</section>`;layer.onclick=e=>{if(e.target===layer)closeSheet()};app.append(layer)}function closeSheet(){document.querySelector('.backdrop')?.remove()}

row.isConnected&&!paused)row.style.transform='translateX(84px)'},900);setTimeout(()=>{if(row.isConnected&&!paused)row.style.transform=''},1800)}}}
window.previewBack=()=>{if(document.querySelector('.backdrop'))closeSheet();else if(page!=='list'){page='list';render()}else settings()};render();
